name: fluxshare
description: "A P2P File Sharing Application with clean monochrome UI design."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^1.0.4
  web_socket_channel: ^2.4.5
  crypto: ^3.0.3
  path_provider: ^2.1.2
  device_info_plus: ^10.1.0
  network_info_plus: ^5.0.1
  permission_handler: ^11.3.1
  file_picker: ^8.0.0
  http: ^1.2.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
